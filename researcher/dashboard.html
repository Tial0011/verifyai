<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — VERIFY-AI Researcher</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/researcher.css" />
</head>
<body class="r-body">
  <div class="r-shell">
    <aside class="r-sidebar">
      <a class="r-sidebar__brand" href="dashboard.html">
        <span class="brand__mark" aria-hidden="true">V</span>
        <span class="r-sidebar__brand-text">VERIFY-AI<span class="r-sidebar__brand-sub">Researcher</span></span>
      </a>
      <ul class="r-nav">
        <li><a href="dashboard.html" aria-current="page">Dashboard</a></li>
        <li><a href="participants.html">Participants</a></li>
        <li><a href="export.html">Export</a></li>
      </ul>
      <div class="r-sidebar__footer">
        <p class="r-sidebar__user" id="researcher-email"></p>
        <button class="r-logout" id="logout-btn" type="button">Log out</button>
      </div>
    </aside>

    <main class="r-main">
      <div class="r-topbar">
        <div>
          <h1 class="r-topbar__title">Dashboard</h1>
          <p class="r-topbar__subtitle">Live overview of VERIFY-AI study submissions.</p>
        </div>
        <span class="r-live-pill" id="live-pill" data-state="ok">
          <span class="r-live-dot" aria-hidden="true"></span>
          <span id="live-label">Live</span>
        </span>
      </div>

      <div class="r-loading" id="loading-state">
        <span class="r-spinner" aria-hidden="true"></span>
        <span>Loading research data…</span>
      </div>

      <div id="dashboard-content" hidden>
        <div class="r-kpi-grid" id="kpi-grid"></div>

        <div class="r-two-col">
          <section class="r-panel">
            <div class="r-panel__head">
              <h2 class="r-panel__title">Recent submissions</h2>
            </div>
            <ul class="r-feed" id="recent-feed"></ul>
          </section>

          <div>
            <section class="r-panel">
              <div class="r-panel__head">
                <h2 class="r-panel__title">By university</h2>
              </div>
              <div class="r-panel__body">
                <div class="r-breakdown" id="university-breakdown"></div>
              </div>
            </section>

            <section class="r-panel">
              <div class="r-panel__head">
                <h2 class="r-panel__title">By study condition</h2>
              </div>
              <div class="r-panel__body">
                <div class="r-breakdown" id="condition-breakdown"></div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="r-toast-stack" id="toast-stack" aria-live="polite"></div>

  <script type="module" src="../js/researcher/dashboard.js"></script>
</body>
</html>
